<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trivia Duel</title>

<style>
:root{--bg1:#1a0f3a;--bg2:#3b1c7a;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.14);--ink:#fff;--mut:rgba(255,255,255,.65);
--a:#ff5d8f;--b:#4cc9f0;--c:#ffd23f;--d:#7bd389;--good:#3ddc84;--bad:#ff4d6d;--acc:#ffd23f}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Fredoka,system-ui,sans-serif;color:var(--ink);background:radial-gradient(1200px 700px at 20% -10%,#5a2bb0 0,transparent 60%),linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh;-webkit-tap-highlight-color:transparent}
#app{max-width:600px;margin:0 auto;padding:18px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;backdrop-filter:blur(6px)}
.logo{font-size:44px;font-weight:700;letter-spacing:.5px;text-align:center;line-height:1.05;margin:10px 0 4px}
.logo span{color:var(--acc)}
.sub{text-align:center;color:var(--mut);margin:0 0 22px}
label{display:block;font-size:14px;color:var(--mut);margin-bottom:14px}
input,select{font:inherit;font-size:18px;width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:rgba(0,0,0,.25);color:#fff;outline:none;margin-top:6px}
input:focus,select:focus{border-color:var(--acc)}
select option{color:#000}
button{font:inherit;cursor:pointer;border:0;border-radius:16px;padding:14px 18px;font-size:18px;font-weight:600;color:#1a0f3a;background:#fff;transition:transform .08s,filter .15s}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:not-allowed}
.big{width:100%;font-size:20px;padding:16px}
.primary{background:var(--acc)}
.ghost{background:transparent;color:#fff;border:2px solid var(--line)}
.row{display:flex;gap:10px;align-items:stretch;margin:12px 0}
.row input{margin:0;text-transform:uppercase;letter-spacing:6px;text-align:center;font-weight:600}
.row button{flex:0 0 auto}
.or{text-align:center;color:var(--mut);font-size:14px;margin:14px 0 4px}
.note{font-size:14px;color:var(--mut);background:rgba(0,0,0,.2);border-radius:12px;padding:10px 12px;margin-top:14px;line-height:1.4}
.err{color:#ffb3c1;margin-top:12px;text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.chip{display:inline-block;background:rgba(255,255,255,.12);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:500}
.leave{background:transparent;color:var(--mut);padding:6px 10px;font-size:14px;border:1px solid var(--line)}
.code{font-size:56px;font-weight:700;letter-spacing:12px;text-align:center;color:var(--acc);margin:4px 0 0}
.center{text-align:center}
.mut{color:var(--mut)}
h2{margin:0 0 10px;font-size:22px}
.players{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}
.pl{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.22);border-radius:999px;padding:5px 12px 5px 5px;font-weight:500}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#1a0f3a;flex:0 0 auto;font-size:15px}
.pl.done{outline:2px solid var(--good)}
.tick{color:var(--good);font-weight:700}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.settings label{margin:0;font-size:13px}
.settings select{font-size:16px;padding:10px}
.timer{height:10px;background:rgba(0,0,0,.3);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--acc),var(--a));border-radius:99px;transition:width .15s linear}
.tnum{font-size:22px;font-weight:700;min-width:36px;text-align:right}
.qtext{font-size:26px;font-weight:600;line-height:1.25;margin:6px 0 20px;min-height:66px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{min-height:88px;font-size:19px;line-height:1.2;color:#1a0f3a;padding:12px;border-radius:18px;box-shadow:0 5px 0 rgba(0,0,0,.25);word-break:break-word}
.opt:nth-child(1){background:var(--a)}.opt:nth-child(2){background:var(--b)}.opt:nth-child(3){background:var(--c)}.opt:nth-child(4){background:var(--d)}
.opts.locked .opt{opacity:.35;cursor:default}
.opts.locked .opt.mine{opacity:1;outline:4px solid #fff}
.opts.timeup .opt:not(.mine){opacity:.35;cursor:default}
.opts.reveal .opt{opacity:.3;cursor:default}
.opts.reveal .opt.right{opacity:1;outline:4px solid var(--good)}
.opts.reveal .opt.mine.wrong{opacity:.9;outline:4px solid var(--bad)}
.status{text-align:center;margin:16px 0 4px;font-size:18px;min-height:26px}
.result{font-size:30px;font-weight:700;text-align:center;margin:14px 0 4px}
.result.good{color:var(--good)}.result.bad{color:#ffb3c1}
.board{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.br{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.22);border-radius:14px;padding:8px 12px}
.br.me{outline:2px solid var(--acc)}
.br .rk{width:28px;text-align:center;font-weight:700;color:var(--mut)}
.br .nm{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br .dl{font-size:14px;width:56px;text-align:right}
.br .sc{font-weight:700;width:64px;text-align:right}
.dl.g{color:var(--good)}.dl.b{color:#ffb3c1}
.count{font-size:110px;font-weight:700;text-align:center;color:var(--acc);line-height:1;margin:20px 0}
.win{font-size:34px;font-weight:700;text-align:center;margin:6px 0}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.you{font-size:12px;color:var(--acc);margin-left:4px}
.daily{margin-bottom:16px;background:linear-gradient(135deg,rgba(255,210,63,.18),rgba(255,93,143,.12));border-color:rgba(255,210,63,.35)}
.dhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.dtitle{font-size:24px;font-weight:700}
.dstat{margin:8px 0 14px;line-height:1.4}
.drow{display:flex;justify-content:space-between;gap:8px;margin-top:10px;flex-wrap:wrap}
.link{background:transparent;color:#fff;padding:6px 2px;font-size:16px;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:12px 0 18px}
.stats div{background:rgba(0,0,0,.22);border-radius:14px;padding:10px;text-align:center}
.stats b{display:block;font-size:24px}
.stats span{font-size:13px;color:var(--mut)}
.tabs{display:flex;gap:6px;background:rgba(0,0,0,.25);padding:5px;border-radius:14px}
.tab{flex:1;background:transparent;color:#fff;padding:10px 6px;font-size:16px;border-radius:10px}
.tab.on{background:var(--acc);color:#1a0f3a}
@media (max-width:420px){.qtext{font-size:22px}.opt{font-size:17px;min-height:78px}.logo{font-size:38px}.code{font-size:46px}.settings{grid-template-columns:1fr}}
</style>
</head>

for (const c of CATS) for (const r of RAW[c]) Q.push({c, lv:'s', q:r[0], o:r.slice(1)});
for (const c of CATS) for (const r of (RAW_HARD[c]||[])) Q.push({c, lv:'h', q:r[0], o:r.slice(1)});
for (const c of CATS) for (const r of (RAW_HARD2[c]||[])) Q.push({c, lv:'h', q:r[0], o:r.slice(1)});
for (const c of CATS) for (const r of (RAW_DAILY[c]||[])) Q.push({c, lv:'d', q:r[0], o:r.slice(1)}); // daily quiz only
const LEVELS = {h:'Hard', s:'Standard', m:'Mixed'};

const COLORS = ['#ff5d8f','#4cc9f0','#ffd23f','#7bd389','#b388ff','#ff9f43','#00d1b2','#ff8fab','#a0e7e5','#f4a261'];
const REVEAL = 4500, COUNTDOWN = 3000;

const ROOMS = 'trivia_rooms', HEARTBEAT = 8000, STALE = 22000;
let fdb = null, fbRoom = null, fbMe = null, myId = null, roomDoc = null, playerDocs = {}, lastSeen = {}, fbUnsubs = [], hbTimer = null, migrating = false;
let lastKey = '', phaseStart = Date.now(), lastGame = null, noHostSince = 0, lastHtml = '';

function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function save(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// ---------- Presence / room helpers ----------
function setP(patch){
  for (const k in patch){ if (patch[k] === null) delete myP[k]; else myP[k] = patch[k]; }
  if (NET === 'fb' && fbMe) pushFb(patch);
  else if (room) room.presence(patch).catch(()=>{});
  update();
}
function fbErr(e){
  S.err = e && e.code === 'permission-denied' ? 'The game server refused access (check the Firestore rules for trivia_rooms).' : "Lost touch with the game server — check your connection.";
  update();
}
function pushFb(patch){
  const pu = {};
  for (const k of ['name','col','ans']) if (k in patch) pu[k] = patch[k] === null ? null : patch[k];
  if (Object.keys(pu).length) fbMe.update(pu).catch(fbErr);
  if (patch.g && fbAmHost()) fbRoom.update({g: patch.g}).catch(fbErr);
}
function fbAmHost(){ return roomDoc ? roomDoc.host === myId : !!myP.host; }
function fbActive(id){ return id === myId || (playerDocs[id] && Date.now() - (lastSeen[id] || 0) < STALE); }
function fbPeers(){
  const out = [];
  const ids = new Set(Object.keys(playerDocs)); ids.add(myId);
  for (const id of ids){
    if (!fbActive(id)) continue;
    let pres;
    if (id === myId){
      pres = {name: myP.name, col: myP.col, ans: myP.ans};
      if (fbAmHost() && myP.g){ pres.host = true; pres.hs = 1; pres.g = myP.g; }
    } else {
      const d = playerDocs[id] || {};
      pres = {name: d.name, col: d.col, ans: d.ans};
      if (roomDoc && roomDoc.host === id){ pres.host = true; pres.hs = 1; pres.g = roomDoc.g; }
    }
    out.push({peer:id, isMe:id===myId, sameTab:id===myId, kind:'viewer', guest:false, presence:pres});
  }
  return out;
}
function setG(patch){ setP({g:{...myP.g, ...patch}}); }

function peers(){
  if (NET === 'fb' && fbMe) return fbPeers();
  if (!room) return [{peer:'solo', isMe:true, sameTab:true, kind:'viewer', presence:myP}];
  const ps = room.peers().filter(p => p.kind !== 'agent');
  let out = [], foundMe = false;
  for (const p of ps){
    if (p.isMe && p.sameTab){ foundMe = true; myPeer = p.peer; out.push({...p, presence:myP}); }
    else out.push(p);
  }
  if (!foundMe) out.push({peer: myPeer || '~me', isMe:true, sameTab:true, kind:'viewer', presence:myP});
  return out;
}
const isMeP = p => p.isMe && p.sameTab;
function players(ps){ return ps.filter(p => p.presence && typeof p.presence.name === 'string' && p.presence.name); }
function hostOf(ps){
  const hs = ps.filter(p => p.presence && p.presence.host && p.presence.g && typeof p.presence.g === 'object');
  hs.sort((a,b) => (a.presence.hs||0) - (b.presence.hs||0) || (a.peer < b.peer ? -1 : 1));
  return hs[0] || null;
}
function validGame(g){ return g && Array.isArray(g.q) && typeof g.ph === 'string' && g.q.every(i => Number.isInteger(i) && i>=0 && i<Q.length); }
function derive(){
  const ps = peers(), pl = players(ps), h = hostOf(ps);
  let g = h && validGame(h.presence.g) ? h.presence.g : null;
  if (!g && NET === 'fb' && fbMe && roomDoc && validGame(roomDoc.g)) g = roomDoc.g; // host briefly away
  return {ps, pl, h, g, amHost: !!(h && isMeP(h))};
}
function answerOf(p, g, qi){
  const a = p.presence && p.presence.ans;
  if (!a || a.e !== g.e || !a.a) return null;
  const v = a.a[qi];
  return Array.isArray(v) && v.length === 2 ? v : null;
}
function points(a, d){
  if (!a || a[0] !== 0) return 0;
  const t = Math.max(0, Number(a[1]) || 0);
  return 500 + Math.round(500 * Math.max(0, 1 - t / (d*1000)));
}
function standings(g, pl){
  const upto = g.ph === 'o' ? g.q.length : g.ph === 'r' ? g.qi + 1 : g.qi;
  return pl.map(p => {
    let s = 0, c = 0, last = 0;
    for (let i=0;i<upto;i++){ const pt = points(answerOf(p,g,i), g.d); s += pt; if (pt) c++; if (i === g.qi) last = pt; }
    return {p, s, c, last};
  }).sort((a,b) => b.s - a.s);
}
function orderFor(g){
  const k = g.e + ':' + g.qi;
  return orderCache[k] || (orderCache[k] = shuffle([0,1,2,3]));
}
function colorOf(p){ const c = p.presence.col; return (typeof c === 'string' && /^#[0-9a-f]{6}$/i.test(c)) ? c : '#ccc'; }
function avatar(p){ return `<span class="av" style="background:${colorOf(p)}">${esc((p.presence.name||'?').trim().charAt(0).toUpperCase())}</span>`; }

// ---------- Rendering ----------
function render(d){
  if (S.screen === 'home') return renderHome();
  if (S.screen === 'profile') return renderProfile();
  if (S.screen === 'daily') return renderDailyIntro();
  if (S.screen === 'boards') return renderBoards();
  const {g, pl, amHost} = d;
  const quitLabel = S.daily && g && g.ph !== 'o' ? (Date.now() - (S.quitArm||0) < 4000 ? 'Tap again to quit' : 'Quit') : 'Leave';
  const head = `<div class="top"><span class="chip">${S.daily ? '📅 Daily Quiz · ' + esc(prettyDay(S.daily, true)) : S.solo ? 'Solo practice' : 'Room ' + esc(S.code)}</span><button class="leave" data-act="leave">${quitLabel}</button></div>`;
  if (!g){
    const waited = Date.now() - S.joinAt > 4000;
    return head + `<div class="card center"><h2>${waited ? 'No game found' : 'Joining room ' + esc(S.code) + '…'}</h2>
      <p class="mut">${waited ? 'Nobody is hosting code <b>' + esc(S.code) + '</b> right now. Check the code, or ask the host to create the game first.' : 'Looking for the host…'}</p></div>`;
  }
  if (g.ph === 'l') return head + renderLobby(g, pl, amHost);
  if (g.ph === 'c' && S.daily) return head + `<div class="card center"><h2>Today's Daily Quiz</h2><p class="mut">${g.q.length} hard questions · mixed topics · ${g.d}s each</p>
      <div class="count" id="tnum">3</div><p class="mut">One attempt only — good luck, ${esc(P.profile ? P.profile.name : '')}!</p></div>`;
  if (g.ph === 'c') return head + `<div class="card center"><h2>Get ready!</h2><p class="mut">${g.q.length} questions · ${esc(LEVELS[g.lv]||'Mixed')} · ${esc(g.cat)} · ${g.d}s each</p>
      <div class="count" id="tnum">3</div><p class="mut">Faster correct answers score more points.</p></div>`;
  if (g.ph === 'q' || g.ph === 'r') return head + renderQuestion(g, pl);
  if (g.ph === 'o') return head + renderOver(g, pl, amHost);
  return head;
}

function renderLobby(g, pl, amHost){
  const sel = (key, opts, val) => `<select data-set="${key}" ${amHost?'':'disabled'}>${opts.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(val)?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;

    ${S.solo ? '<h2 class="center">Solo practice</h2>' : `<p class="center mut" style="margin:0">Game code</p><div class="code">${esc(S.code)}</div><p class="center mut" style="margin-top:2px">Friends open this page, tap Join and type the code.</p>`}
    <h2 style="margin-top:18px">Players (${pl.length})</h2>
    <div class="players">${pl.map(p=>`<span class="pl">${avatar(p)}${esc(p.presence.name)}${p.presence.host?' 👑':''}${isMeP(p)?'<span class="you">you</span>':''}</span>`).join('')}</div>
    <div class="settings">
      <label>Difficulty${sel('lv', [['h','Hard'],['s','Standard'],['m','Mixed']], g.lv || 'm')}</label>

    ${amHost ? `<button class="big primary" data-act="start">Start game</button>` : `<p class="status mut">Waiting for the host to start…</p>`}
  </div>`;
}

function renderQuestion(g, pl){
  const qd = Q[g.q[g.qi]], order = orderFor(g), me = pl.find(isMeP);
  const mine = me ? answerOf(me, g, g.qi) : null;
  const reveal = g.ph === 'r';
  const cls = reveal ? 'reveal' : (mine ? 'locked' : '');
  const btns = order.map(i => {
    const c = ['opt']; if (mine && mine[0] === i) c.push('mine'); if (reveal && i === 0) c.push('right'); if (reveal && mine && mine[0] === i && i !== 0) c.push('wrong');
    return `<button class="${c.join(' ')}" data-act="ans" data-i="${i}">${esc(qd.o[i])}</button>`;
  }).join('');
  let below = '';
  if (!reveal){
    const answered = pl.filter(p => answerOf(p, g, g.qi)).length;
    if (S.daily) below = `<p class="status">${mine ? 'Locked in!' : ''}</p>`; else
    below = `<p class="status">${mine ? 'Locked in! ' : ''}<span class="mut">${answered} of ${pl.length} answered</span></p>
      <div class="players" style="justify-content:center">${pl.map(p=>`<span class="pl ${answerOf(p,g,g.qi)?'done':''}">${avatar(p)}${esc(p.presence.name)}${answerOf(p,g,g.qi)?' <span class="tick">✓</span>':''}</span>`).join('')}</div>`;
  } else {
    const pts = points(mine, g.d);
    below = `<div class="result ${pts?'good':'bad'}">${pts ? '+' + pts + ' points!' : mine ? 'Not quite!' : "Time's up!"}</div>
      <p class="center mut" style="margin:0">Answer: <b style="color:#fff">${esc(qd.o[0])}</b></p>${S.daily ? `<p class="center mut">Running total: <b style="color:#fff">${standings(g, pl)[0].s}</b></p>` : board(g, pl, true)}`;
  }
  return `<div class="top" style="margin-bottom:4px"><span class="chip">Q${g.qi+1} of ${g.q.length}</span><span class="chip">${esc(qd.c)}</span><span class="tnum" id="tnum"></span></div>
    <div class="timer"><i id="tbar"></i></div>
    <div class="qtext">${esc(qd.q)}</div>
    <div class="opts ${cls}" id="opts">${btns}</div>${below}`;
}

function board(g, pl, showDelta){
  const st = standings(g, pl), medals = ['🥇','🥈','🥉'];
  return `<div class="board">${st.map((r,i)=>`<div class="br ${isMeP(r.p)?'me':''}"><span class="rk">${g.ph==='o'&&i<3?medals[i]:i+1}</span>${avatar(r.p)}<span class="nm">${esc(r.p.presence.name)}${isMeP(r.p)?'<span class="you">you</span>':''}</span>
    ${showDelta ? `<span class="dl ${r.last?'g':'b'}">${r.last?'+'+r.last:'✗'}</span>` : `<span class="dl mut">${r.c}/${g.q.length}</span>`}<span class="sc">${r.s}</span></div>`).join('')}</div>`;
}

function renderOver(g, pl, amHost){
  if (S.daily) return renderDailyOver(g, pl);
  const st = standings(g, pl);
  const top = st[0], tie = st.length > 1 && st[1].s === top.s;
  let headline = 'Game over!';
  if (top) headline = st.length === 1 ? `You scored ${top.s}!` : tie ? "It's a tie! 🤝" : `🏆 ${esc(top.p.presence.name)} wins!`;
  return `<div class="card"><div class="win">${headline}</div>
    <p class="center mut" style="margin:0">${g.q.length} questions · ${esc(LEVELS[g.lv]||'Mixed')} · ${esc(g.cat)}</p>
    ${board(g, pl, false)}
    <div class="btns">${amHost ? `<button class="big primary" data-act="again">Play again</button>` : `<p class="status mut">Waiting for the host to start another round…</p>`}
    <button class="big ghost" data-act="leave">Leave game</button></div></div>`;
}

function update(){
  const d = derive();
  if (S.screen === 'game'){
    if (d.g){
      lastGame = d.g;
      const key = d.g.e + '|' + d.g.ph + '|' + d.g.qi;
      if (key !== lastKey){ lastKey = key; phaseStart = Date.now(); }
    }
    // Two hosts? The earliest keeps it; the other steps down.
    if (myP.host && d.h && !isMeP(d.h)){ myP.host = false; setP({host:null, hs:null, g:null}); return; }
  }
  const html = render(d);
  if (html !== lastHtml){ lastHtml = html; app.innerHTML = html; }
  tickVisuals(d);
}

function tickVisuals(d){
  const g = d.g; if (!g) return;
  const total = g.ph === 'q' ? g.d*1000 : g.ph === 'c' ? COUNTDOWN : g.ph === 'r' ? revealMs() : 0;
  const left = Math.max(0, total - (Date.now() - phaseStart));
  const bar = document.getElementById('tbar');
  if (bar) bar.style.width = (g.ph === 'q' && total ? left/total*100 : 0) + '%';
  const tn = document.getElementById('tnum');
  if (tn) tn.textContent = g.ph === 'r' ? '' : Math.max(g.ph==='c'?1:0, Math.ceil(left/1000));
  const opts = document.getElementById('opts');
  if (opts && g.ph === 'q') opts.classList.toggle('timeup', left <= 0);
}

// ---------- Host game loop ----------
function tick(){
  if (S.screen !== 'game') return;
  const d = derive(), g = d.g, now = Date.now();
  if (S.screen === 'game' && !g && Date.now() - S.joinAt > 4000) update();
  tickVisuals(d);
  if (S.daily && g && g.ph === 'o' && !S.dailySent) submitDaily(g);
  if (S.quitArm && Date.now() - S.quitArm > 4000){ S.quitArm = 0; update(); }
  if (d.amHost && g){
    const el = now - phaseStart;
    if (g.ph === 'c' && el >= COUNTDOWN) setG({ph:'q', qi:0});
    else if (g.ph === 'q'){
      const all = d.pl.length > 0 && d.pl.every(p => answerOf(p, g, g.qi));
      if (el >= g.d*1000 + 400 || (all && el >= 900)) setG({ph:'r'});
    } else if (g.ph === 'r' && el >= revealMs()){
      if (g.qi + 1 < g.q.length) setG({ph:'q', qi:g.qi+1}); else setG({ph:'o'});
    }
  }
  // Firebase: if the host has gone quiet, the active player with the lowest id takes over.
  if (NET === 'fb' && fbMe && roomDoc && roomDoc.host !== myId && !fbActive(roomDoc.host) && !migrating && validGame(roomDoc.g)){
    const cand = Object.keys(playerDocs).concat([myId]).filter(fbActive).sort()[0];
    if (cand === myId){
      migrating = true;
      myP.host = true; myP.g = {...roomDoc.g};
      fbRoom.update({host: myId}).catch(fbErr).finally(() => { migrating = false; });
      lastKey = ''; update();
    }
  }
  // Host left mid-game: the player with the lowest id takes over after 3 s.
  if (room && !d.h && lastGame){
    if (!noHostSince) noHostSince = now;
    if (now - noHostSince > 3000 && myP.name){
      const cand = d.pl.map(p => p.peer).sort()[0];
      if (cand && cand === myPeer){ noHostSince = 0; setP({host:true, hs:Date.now(), g:{...lastGame}}); }
    }
  } else noHostSince = 0;
}
setInterval(tick, 150);

// ---------- Actions ----------
function newCode(){ const L='ABCDEFGHJKLMNPQRSTUVWXYZ'; let s=''; for(let i=0;i<4;i++) s+=L[Math.floor(Math.random()*L.length)]; return s; }
function needName(){
  const n = (S.name||'').trim();
  if (!n){ S.err = 'Type your name first.'; update(); return null; }
  save('td_name', n); return n;
}
function baseMe(name, host){
  const p = {name, col: COLORS[Math.floor(Math.random()*COLORS.length)]};
  if (host){ p.host = true; p.hs = Date.now(); p.g = {e:0, ph:'l', qi:0, q:[], d:15, n:10, cat:'Mixed', lv:'h'}; }
  return p;
}
function rid(){ const a = new Uint8Array(8); crypto.getRandomValues(a); return Array.from(a, b => b.toString(16).padStart(2,'0')).join(''); }
async function enterFb(code, host){
  const name = needName(); if (!name) return;
  if (S.busy) return;
  S.err = ''; S.busy = true; update();
  try{
    const coll = fdb.collection(ROOMS);
    if (host){
      for (let i = 0; i < 6; i++){ const s = await coll.doc(code).get(); if (!s.exists) break; code = newCode(); }
    } else {
      const s = await coll.doc(code).get();
      if (!s.exists){ S.busy = false; S.err = `No game found with code ${code}. Check the code, or ask the host to create the game first.`; update(); return; }
    }
    myId = rid(); fbRoom = coll.doc(code); fbMe = fbRoom.collection('players').doc(myId);
    roomDoc = null; playerDocs = {}; lastSeen = {};
    myP = baseMe(name, host);
    const ts = firebase.firestore.FieldValue.serverTimestamp();
    if (host) await fbRoom.set({host: myId, g: myP.g, t: ts});
    await fbMe.set({name: myP.name, col: myP.col, ans: null, hb: 0, t: ts});
  }catch(e){ S.busy = false; fbMe = null; fbErr(e); return; }
  S.busy = false; lastGame = null; lastKey = ''; S.code = code; S.solo = false; S.screen = 'game'; S.joinAt = Date.now();
  fbUnsubs.push(fbRoom.onSnapshot(s => {
    roomDoc = s.exists ? s.data() : null;
    if (roomDoc && roomDoc.host !== myId && myP.host){ delete myP.host; delete myP.g; }
    update();
  }, fbErr));
  fbUnsubs.push(fbRoom.collection('players').onSnapshot(snap => {
    snap.docChanges().forEach(ch => {
      const id = ch.doc.id;
      if (ch.type === 'removed'){ delete playerDocs[id]; delete lastSeen[id]; return; }
      const d = ch.doc.data(), prev = playerDocs[id];
      if (!prev || prev.hb !== d.hb) lastSeen[id] = Date.now();
      playerDocs[id] = d;
    });
    update();
  }, fbErr));
  let hb = 0;
  hbTimer = setInterval(() => { if (fbMe) fbMe.update({hb: ++hb}).catch(() => {}); }, HEARTBEAT);
  update();
}
function leaveFb(){
  fbUnsubs.forEach(u => { try{ u(); }catch(e){} }); fbUnsubs = [];
  clearInterval(hbTimer); hbTimer = null;
  if (fbMe){
    const others = Object.keys(playerDocs).filter(id => id !== myId && fbActive(id));
    fbMe.delete().catch(() => {});
    if (fbAmHost() && !others.length && fbRoom) fbRoom.delete().catch(() => {});
  }
  fbMe = null; fbRoom = null; roomDoc = null; playerDocs = {}; lastSeen = {}; myId = null;
}
window.addEventListener('pagehide', () => { if (fbMe) fbMe.delete().catch(() => {}); });

async function enter(code, host){
  if (NET === 'fb') return enterFb(code, host);
  const name = needName(); if (!name) return;
  S.err = '';
  try{
    room = await lobby.join('trivia-' + code.toLowerCase());
    room.onPeers(() => update(), () => {});
  }catch(e){ room = null; S.err = "Couldn't connect to that room. Try again."; update(); return; }
  myP = {}; lastGame = null; lastKey = ''; S.code = code; S.solo = false; S.screen = 'game'; S.joinAt = Date.now();
  setP(baseMe(name, host));
}

const actions = {
  create(){ if (S.mp === 'ok') enter(newCode(), true); },
  join(){
    const code = (S.code||'').trim().toUpperCase();
    if (!/^[A-Z]{4}$/.test(code)){ S.err = 'Enter the 4-letter game code.'; update(); return; }
    if (S.mp === 'ok') enter(code, false);
  },
  solo(){
    const name = needName(); if (!name) return;
    S.err = ''; room = null; myP = {}; lastGame = null; lastKey = ''; S.solo = true; S.code = 'SOLO'; S.screen = 'game'; S.joinAt = Date.now();
    setP(baseMe(name, true));
  },
  leave(){
    if (S.daily){
      const g = myP.g;
      if (g && g.ph !== 'o' && Date.now() - (S.quitArm||0) > 4000){ S.quitArm = Date.now(); update(); return; }
      S.quitArm = 0; S.daily = null; myP = {}; lastGame = null; lastKey = ''; S.solo = false; S.code = ''; S.screen = 'home'; update(); return;
    }
    if (room) room.leave().catch(()=>{});
    if (NET === 'fb') leaveFb();
    room = null; myP = {}; lastGame = null; lastKey = ''; S.screen = 'home'; S.solo = false; S.code = ''; S.err = '';
    update();
  },
  start(){
    const g = myP.g; if (!g) return;
    let pool = Q.map((q,i)=>i).filter(i => Q[i].lv !== 'd'); if (g.cat !== 'Mixed') pool = pool.filter(i => Q[i].c === g.cat);
    const lv = g.lv || 'm'; if (lv !== 'm') pool = pool.filter(i => Q[i].lv === lv);
    // Avoid repeats: this device remembers which questions it has already used.
    const n = Math.min(g.n, pool.length), UKEY = 'td_used_' + Q.length;
    let used = []; try{ used = JSON.parse(localStorage.getItem(UKEY) || '[]'); }catch(e){}
    const usedSet = new Set(used), fresh = pool.filter(i => !usedSet.has(i));
    let ids;
    if (fresh.length >= n) ids = shuffle(fresh).slice(0, n);
    else {
      ids = shuffle(fresh).concat(shuffle(pool.filter(i => usedSet.has(i))).slice(0, n - fresh.length));
      const inPool = new Set(pool); used = used.filter(i => !inPool.has(i)); // this set is used up: start a new cycle
    }
    used = used.concat(ids); save(UKEY, JSON.stringify(used));
    const e = Date.now();
    setP({g:{...g, e, ph:'c', qi:0, q:ids}, ans:{e, a:{}}});
  },
  again(){ setG({ph:'l', qi:0}); },
  ans(el){
    const g = derive().g; if (!g || g.ph !== 'q') return;
    if (Date.now() - phaseStart > g.d*1000) return;
    let ans = myP.ans; if (!ans || ans.e !== g.e) ans = {e:g.e, a:{}};
    if (ans.a[g.qi]) return;
    setP({ans:{e:g.e, a:{...ans.a, [g.qi]:[+el.dataset.i, Date.now() - phaseStart]}}});
  }
};

// ---------- Daily quiz, player profiles and leaderboards (Firebase only) ----------
const PLAYERS = 'trivia_players', DAYS = 'trivia_daily', DAILY_SECS = 20, DAY0 = Date.UTC(2026, 10, 8);
const P = {auth:null, uid:null, profile:null, loaded:false, today:null, todayDoc:null, google:false, busy:false, err:''};
S.board = 'today'; S.boardData = {};

function ukDay(t){ return new Intl.DateTimeFormat('en-CA', {timeZone:'Europe/London', year:'numeric', month:'2-digit', day:'2-digit'}).format(t || new Date()); }
function dayUTC(day){ const [y,m,d] = day.split('-').map(Number); return Date.UTC(y, m-1, d); }
function prevDay(day){ return new Date(dayUTC(day) - 864e5).toISOString().slice(0,10); }
function prettyDay(day, short){ return new Date(dayUTC(day)).toLocaleDateString('en-GB', short ? {day:'numeric', month:'short', timeZone:'UTC'} : {weekday:'long', day:'numeric', month:'long', timeZone:'UTC'}); }
function hashStr(s){ let h = 2166136261; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function seededShuffle(a, seed){ const r = rng(seed); a = a.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }

// Everyone gets the same 10 questions each UK day: one from every category plus two
// rotating extras. Each category works through its own shuffled list, so nothing
// repeats until that category's daily questions have all been used.
const DAILY_POOL = CATS.map(c => Q.map((q,i) => i).filter(i => Q[i].lv === 'd' && Q[i].c === c));
function dailyPick(k, u){ const list = DAILY_POOL[k], cyc = Math.floor(u / list.length); return seededShuffle(list, hashStr('td-daily|' + CATS[k] + '|' + cyc))[u % list.length]; }
function dailyIds(day){
  const di = Math.max(0, Math.round((dayUTC(day) - DAY0) / 864e5)), K = CATS.length;
  const used = CATS.map(() => 0), extras = d => [(2*d) % K, (2*d+1) % K];
  for (let d = 0; d < di; d++){ for (let k = 0; k < K; k++) used[k]++; for (const k of extras(d)) used[k]++; }
  const picks = [];
  for (let k = 0; k < K; k++) picks.push(dailyPick(k, used[k]++));
  for (const k of extras(di)) picks.push(dailyPick(k, used[k]++));
  return seededShuffle(picks, hashStr('td-order|' + day));
}
function revealMs(){ return S.daily ? 3000 : REVEAL; }

function playerRef(){ return fdb.collection(PLAYERS).doc(P.uid); }
function scoreRef(day){ return fdb.collection(DAYS).doc(day).collection('scores').doc(P.uid); }
const TS = () => firebase.firestore.FieldValue.serverTimestamp();
function liveStreak(pr){ if (!pr || !pr.lastDay) return 0; const t = ukDay(); return (pr.lastDay === t || pr.lastDay === prevDay(t)) ? (pr.streak || 0) : 0; }
function fmt(n){ return Number(n || 0).toLocaleString('en-GB'); }
function authErr(e){ return e && e.code === 'permission-denied' ? 'The game server refused access — check the Firestore rules for trivia_players and trivia_daily.' : "Couldn't reach the game server — check your connection."; }

function initAuth(){
  if (!firebase.auth) return;
  P.auth = firebase.auth();
  P.auth.getRedirectResult().catch(handleLinkError);
  P.auth.onAuthStateChanged(async u => {
    if (!u){ P.uid = null; P.auth.signInAnonymously().catch(e => { P.err = authErr(e); P.loaded = true; update(); }); return; }
    P.uid = u.uid; P.google = (u.providerData || []).some(p => p && p.providerId === 'google.com');
    await loadProfile();
  });
}
async function loadProfile(){
  try{
    const s = await playerRef().get();
    P.profile = s.exists ? s.data() : null;
    if (P.profile && P.profile.name){ S.name = P.profile.name; save('td_name', P.profile.name); }
    P.today = ukDay();
    const t = await scoreRef(P.today).get();
    P.todayDoc = t.exists ? t.data() : null;
    P.err = '';
  }catch(e){ P.err = authErr(e); }
  P.loaded = true; update();
}

function dailyCard(){
  const day = ukDay(), pr = P.profile, td = P.today === day ? P.todayDoc : null;
  let status, btn;
  if (!P.loaded) { status = 'Connecting…'; btn = `<button class="big primary" disabled>Daily Quiz</button>`; }
  else if (td && td.done){ status = `Done today: <b>${fmt(td.score)}</b> points · ${td.correct}/10 correct`; btn = `<button class="big primary" data-act="boards">See today's leaderboard</button>`; }
  else if (td){ status = "You started today's quiz but didn't finish, so it scored 0. Back tomorrow!"; btn = `<button class="big primary" data-act="boards">See today's leaderboard</button>`; }
  else { status = '10 hard questions, mixed topics. One attempt a day.'; btn = `<button class="big primary" data-act="daily" ${P.busy?'disabled':''}>Play today's quiz</button>`; }
  const streak = liveStreak(pr);
  return `<div class="card daily">
    <div class="dhead"><span class="dtitle">📅 Daily Quiz</span><span class="mut">${esc(prettyDay(day))}</span></div>
    <p class="dstat">${status}</p>
    ${btn}
    <div class="drow"><button class="link" data-act="profile">${pr ? `👤 ${esc(pr.name)}${streak ? ` · 🔥 ${streak}` : ''} · edit` : '👤 Create your player'}</button>
    ${td ? '' : `<button class="link" data-act="boards">🏆 Leaderboards</button>`}</div>
    ${P.err ? `<div class="err">${esc(P.err)}</div>` : ''}
  </div>`;
}

function renderProfile(){
  const pr = P.profile;
  const back = `<div class="top"><span class="chip">${pr ? 'Your player' : 'Create your player'}</span><button class="leave" data-act="home">Back</button></div>`;
  const google = P.google
    ? `<p class="note">✓ Saved to Google. Your player, scores and streak follow you to any device where you sign in.</p><button class="big ghost" data-act="signout">Sign out</button>`
    : `<p class="note">${pr ? 'Your player is saved on this device. Save it to Google to keep it if you change device or clear your browser.' : 'Played on another device and saved to Google? Sign in to carry on.'}</p>
       <button class="big ghost" data-act="google" ${P.busy?'disabled':''}>${pr ? 'Save to Google' : 'Sign in with Google'}</button>`;
  if (!pr) return back + `<div class="card">
    <h2>Create your player</h2>
    <p class="mut" style="margin-top:0">Your name appears on the daily, all-time and streak leaderboards. This device will remember you.</p>
    <label>Player name<input id="pnm" maxlength="16" autocomplete="off" placeholder="e.g. Brooky" value="${esc(S.pname ?? S.name ?? '')}"></label>
    <button class="big primary" data-act="saveName" ${P.busy||!P.uid?'disabled':''}>Create player</button>
    <div class="or">or</div>${google}
    ${S.err ? `<div class="err">${esc(S.err)}</div>` : ''}</div>`;
  const streak = liveStreak(pr);
  return back + `<div class="card">
    <h2>${esc(pr.name)}</h2>
    <div class="stats">
      <div><b>${fmt(pr.total)}</b><span>total points</span></div>
      <div><b>${pr.days || 0}</b><span>days played</span></div>
      <div><b>🔥 ${streak}</b><span>current streak</span></div>
      <div><b>${pr.best || 0}</b><span>best streak</span></div>
    </div>
    <label>Change name<input id="pnm" maxlength="16" autocomplete="off" value="${esc(S.pname ?? pr.name)}"></label>
    <button class="big primary" data-act="saveName" ${P.busy?'disabled':''}>Save name</button>
    <div style="margin-top:16px">${google}</div>
    ${S.err ? `<div class="err">${esc(S.err)}</div>` : ''}</div>`;
}

function renderDailyIntro(){
  return `<div class="top"><span class="chip">📅 Daily Quiz</span><button class="leave" data-act="home">Back</button></div>
  <div class="card center"><h2>${esc(prettyDay(ukDay()))}</h2>
    <p class="mut">10 hard questions from every topic · 20 seconds each · faster correct answers score more.</p>
    <p><b>You only get one attempt.</b> Quitting part-way through still uses it up.</p>
    <button class="big primary" data-act="startDaily" ${P.busy?'disabled':''}>${P.busy ? 'Getting ready…' : "I'm ready — start"}</button>
    ${S.err ? `<div class="err">${esc(S.err)}</div>` : ''}</div>`;
}

function renderDailyOver(g, pl){
  const r = S.dailyResult || {}, me = standings(g, pl)[0] || {s:0, c:0};
  return `<div class="card center"><div class="win">${fmt(me.s)} points</div>
    <p class="mut" style="margin:0">${me.c} out of ${g.q.length} correct</p>
    <div class="stats" style="margin:18px 0">
      <div><b>🔥 ${r.streak || '–'}</b><span>day streak</span></div>
      <div><b>${r.rank ? '#' + r.rank : r.saving ? '…' : '–'}</b><span>today's rank</span></div>
    </div>
    ${r.saving ? '<p class="mut">Saving your score…</p>' : r.error ? `<p class="err">${esc(r.error)}</p>` : '<p class="mut">Saved. Come back tomorrow for a new quiz!</p>'}
    <div class="btns"><button class="big primary" data-act="boards">Leaderboards</button><button class="big ghost" data-act="leave">Home</button></div></div>`;
}

async function submitDaily(g){
  S.dailySent = true;
  const me = standings(g, players(peers()))[0] || {s:0, c:0};
  const day = S.daily, pr = P.profile || {};
  const streak = pr.lastDay === day ? (pr.streak || 1) : pr.lastDay === prevDay(day) ? (pr.streak || 0) + 1 : 1;
  const np = {name: pr.name, total: (pr.total || 0) + me.s, days: (pr.days || 0) + 1, correct: (pr.correct || 0) + me.c,
              streak, best: Math.max(pr.best || 0, streak), lastDay: day, lastScore: me.s, updated: TS()};
  S.dailyResult = {streak, saving: true}; update();
  try{
    const b = fdb.batch();
    b.update(scoreRef(day), {score: me.s, correct: me.c, done: true, streak});
    b.set(playerRef(), np, {merge: true});
    await b.commit();
    P.profile = {...pr, ...np}; P.todayDoc = {...(P.todayDoc || {}), score: me.s, correct: me.c, done: true};
    S.dailyResult.saving = false; update();
    await loadBoard('today');
    const rows = S.boardData.today;
    if (Array.isArray(rows)){ const i = rows.findIndex(x => x.id === P.uid); if (i >= 0) S.dailyResult.rank = i + 1; }
  }catch(e){ S.dailyResult.saving = false; S.dailyResult.error = authErr(e); }
  update();
}

async function loadBoard(kind){
  S.boardData[kind] = 'loading'; update();
  try{
    let rows;
    if (kind === 'today'){
      const s = await fdb.collection(DAYS).doc(ukDay()).collection('scores').orderBy('score', 'desc').limit(60).get();
      rows = s.docs.map(d => ({id: d.id, ...d.data()})).filter(r => r.done).map(r => ({id: r.id, name: r.name, v: fmt(r.score), sub: `${r.correct}/10`}));
    } else if (kind === 'total'){
      const s = await fdb.collection(PLAYERS).orderBy('total', 'desc').limit(50).get();
      rows = s.docs.map(d => ({id: d.id, ...d.data()})).filter(r => r.days).map(r => ({id: r.id, name: r.name, v: fmt(r.total), sub: `${r.days} day${r.days === 1 ? '' : 's'}`}));
    } else {
      const s = await fdb.collection(PLAYERS).orderBy('streak', 'desc').limit(120).get();
      rows = s.docs.map(d => ({id: d.id, ...d.data()})).map(r => ({...r, live: liveStreak(r)})).filter(r => r.live > 0)
        .sort((a, b) => b.live - a.live || (b.best || 0) - (a.best || 0)).map(r => ({id: r.id, name: r.name, v: '🔥 ' + r.live, sub: `best ${r.best || r.live}`}));
    }
    S.boardData[kind] = rows.slice(0, 50);
  }catch(e){ S.boardData[kind] = {error: authErr(e)}; }
  update();
}

function renderBoards(){
  const k = S.board, rows = S.boardData[k], medals = ['🥇','🥈','🥉'];
  const tab = (id, label) => `<button class="tab ${k === id ? 'on' : ''}" data-act="tab" data-k="${id}">${label}</button>`;
  let body;
  if (rows === undefined || rows === 'loading') body = '<p class="mut center">Loading…</p>';
  else if (rows.error) body = `<p class="err">${esc(rows.error)}</p>`;
  else if (!rows.length) body = `<p class="mut center">${k === 'today' ? 'Nobody has played today yet. Be the first!' : k === 'streak' ? 'No live streaks yet.' : 'No scores yet.'}</p>`;
  else body = `<div class="board">${rows.map((r, i) => `<div class="br ${r.id === P.uid ? 'me' : ''}"><span class="rk">${i < 3 ? medals[i] : i + 1}</span><span class="nm">${esc(r.name || 'Player')}${r.id === P.uid ? '<span class="you">you</span>' : ''}</span><span class="dl mut" style="width:auto">${esc(r.sub)}</span><span class="sc" style="width:auto;min-width:64px">${esc(r.v)}</span></div>`).join('')}</div>`;
  const note = k === 'today' ? `Scores for ${esc(prettyDay(ukDay()))}` : k === 'total' ? 'All daily quiz points added up' : 'Days in a row playing the daily quiz';
  return `<div class="top"><span class="chip">🏆 Leaderboards</span><button class="leave" data-act="home">Back</button></div>
  <div class="card"><div class="tabs">${tab('today', 'Today')}${tab('total', 'All-time')}${tab('streak', 'Streaks')}</div>
    <p class="mut center" style="margin:6px 0 0;font-size:14px">${note}</p>${body}
    <button class="big ghost" data-act="refreshBoard" style="margin-top:14px">Refresh</button></div>`;
}

function handleLinkError(e){
  if (!e) return;
  if ((e.code === 'auth/credential-already-in-use' || e.code === 'auth/email-already-in-use') && e.credential){
    // This Google account already has a player: switch to it.
    return P.auth.signInWithCredential(e.credential).catch(x => { S.err = 'Google sign-in failed (' + (x.code || x.message) + ')'; update(); });
  }
  if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') return;
  S.err = 'Google sign-in failed (' + (e.code || e.message) + ')'; update();
}

Object.assign(actions, {
  home(){ S.screen = 'home'; S.err = ''; S.pname = undefined; update(); },
  profile(){ S.screen = 'profile'; S.err = ''; S.pname = undefined; update(); },
  daily(){ S.err = ''; S.after = 'daily'; S.screen = P.profile ? 'daily' : 'profile'; update(); },
  boards(){ S.screen = 'boards'; S.err = ''; loadBoard(S.board); },
  tab(el){ S.board = el.dataset.k; loadBoard(S.board); },
  refreshBoard(){ loadBoard(S.board); },
  async saveName(){
    const name = (S.pname ?? (P.profile && P.profile.name) ?? '').trim();
    if (name.length < 2){ S.err = 'Names need at least 2 characters.'; update(); return; }
    if (!P.uid || P.busy) return;
    P.busy = true; S.err = ''; update();
    try{
      if (P.profile){ await playerRef().update({name}); P.profile = {...P.profile, name}; }
      else {
        const pr = {name, total: 0, days: 0, correct: 0, streak: 0, best: 0, lastDay: '', created: TS()};
        await playerRef().set(pr); P.profile = pr;
      }
      S.name = name; save('td_name', name); S.pname = undefined;
      S.screen = S.after === 'daily' ? 'daily' : 'home'; S.after = null;
    }catch(e){ S.err = authErr(e); }
    P.busy = false; update();
  },
  async google(){
    const u = P.auth && P.auth.currentUser; if (!u) return;
    const prov = new firebase.auth.GoogleAuthProvider();
    P.busy = true; S.err = ''; update();
    try{ await u.linkWithPopup(prov); P.google = true; }
    catch(e){
      if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment', 'auth/web-storage-unsupported'].includes(e.code)){
        try{ await u.linkWithRedirect(prov); }catch(x){ handleLinkError(x); }
      } else await handleLinkError(e);
    }
    P.busy = false; update();
  },
  async signout(){ P.profile = null; P.todayDoc = null; P.loaded = false; S.screen = 'home'; update(); await P.auth.signOut(); },
  async startDaily(){
    if (!P.profile || P.busy) return;
    const day = ukDay(), ref = scoreRef(day);
    P.busy = true; S.err = ''; update();
    try{
      const s = await ref.get();
      if (s.exists){ P.today = day; P.todayDoc = s.data(); P.busy = false; S.screen = 'home'; update(); return; }
      await ref.set({name: P.profile.name, score: 0, correct: 0, done: false, at: TS()});
    }catch(e){ P.busy = false; S.err = authErr(e); update(); return; }
    P.today = day; P.todayDoc = {name: P.profile.name, score: 0, correct: 0, done: false}; P.busy = false;
    room = null; myP = {}; lastGame = null; lastKey = ''; S.solo = true; S.daily = day; S.code = 'DAILY';
    S.dailySent = false; S.dailyResult = null; S.quitArm = 0; S.screen = 'game'; S.joinAt = Date.now();
    const e = Date.now(), ids = dailyIds(day);
    setP({name: P.profile.name, col: COLORS[0], host: true, hs: Date.now(),
          g: {e, ph: 'c', qi: 0, q: ids, d: DAILY_SECS, n: ids.length, cat: 'Mixed topics', lv: 'h'}, ans: {e, a: {}}});
  }
});

app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = actions[el.dataset.act]; if (f) f(el);
});
app.addEventListener('input', e => {
  if (e.target.id === 'nm') S.name = e.target.value;
  if (e.target.id === 'pnm') S.pname = e.target.value;
  if (e.target.id === 'cd'){ e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g,''); S.code = e.target.value; }
});
app.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'cd') actions.join();
  if (e.target.id === 'pnm') actions.saveName();
  if (e.target.id === 'nm' && S.mp === 'ok') actions.create();
});
app.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.set; if (!k || !myP.g) return;
  const v = (k === 'cat' || k === 'lv') ? e.target.value : parseInt(e.target.value, 10);
  setG({[k]: v});
});

// ---------- Start ----------
update();
(async () => {
  if (window.firebase){
    try{ firebase.initializeApp(FIREBASE_CONFIG); fdb = firebase.firestore(); NET = 'fb'; S.mp = 'ok'; initAuth(); update(); return; }
    catch(e){ fdb = null; }
  }
  NET = 'room';
  let tries = 0;
  while (!(window.claude && window.claude.use) && tries < 30){ await new Promise(r => setTimeout(r, 100)); tries++; }
  try{ lobby = window.claude && window.claude.use ? await window.claude.use('room') : null; }catch(e){ lobby = null; }
  S.mp = lobby ? 'ok' : 'off';
  update();
})();
</script>
